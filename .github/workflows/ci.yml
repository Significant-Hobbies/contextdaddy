name: ContextDaddy CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      # DesignSnapshotTests render machine-local inventory and are reviewed on
      # the release Mac; portable behavior tests run on the clean runner.
      - run: python3 scripts/check-daddy-foundation.py --app contextdaddy
      - run: swift test --skip DesignSnapshotTests
      - run: swift build -c release
      - run: python3 -m unittest test_sparkle_support test_release_source test_package_sparkle test_prepare_appcast
        working-directory: scripts

  shared_candidate:
    uses: sass-maker/saas-maker/.github/workflows/daddy-macos-candidate.yml@67dcb59d289c396349244f42778dccbd2953ba41
    with:
      app: contextdaddy
      tooling-ref: 67dcb59d289c396349244f42778dccbd2953ba41

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: npm ci
      - run: mkdir -p public
      - run: npm run check
